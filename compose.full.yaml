name: cloud-storage-full

x-database-url: &database-url '${FULL_DATABASE_URL:-postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}}'

x-s3: &s3
  S3_ENDPOINT: http://seaweedfs:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
  S3_BUCKET: user-files
  S3_FORCE_PATH_STYLE: 'true'

services:
  postgres:
    image: postgres:18.0-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.2.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # The filer and the S3 bucket use separate collections on this volume server.
    command: ['server', '-dir=/data', '-ip=seaweedfs', '-ip.bind=0.0.0.0', '-volume.max=16', '-master.volumeSizeLimitMB=1024', '-filer', '-s3']
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
    volumes:
      - seaweedfs-data:/data
      - ./docker/seaweedfs/filer.toml:/etc/seaweedfs/filer.toml:ro

  migrator:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  s3-init:
    image: cloud-storage-api:local
    build: &api-build
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    command: ['node', 'init-local-bucket.mjs']
    environment: *s3
    volumes:
      - ./apps/api/scripts/init-local-bucket.mjs:/workspace/apps/api/init-local-bucket.mjs:ro
    depends_on:
      seaweedfs:
        condition: service_started

  api:
    image: cloud-storage-api:local
    build: *api-build
    environment:
      <<: *s3
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      TRUST_PROXY: 'true'
      COOKIE_SECURE: 'false'
      UPLOAD_MAX_FILE_SIZE_BYTES: ${UPLOAD_MAX_FILE_SIZE_BYTES:-5368709120}
      UPLOAD_MAX_FILES: ${UPLOAD_MAX_FILES:-100}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    depends_on:
      migrator:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/api/user/me").then(r => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))']
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NGINX_CLIENT_MAX_BODY_SIZE: ${NGINX_CLIENT_MAX_BODY_SIZE:-501g}
    ports:
      - '127.0.0.1:${FULL_WEB_PORT:-8080}:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
